<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rose Grid Floral Print | Weave Inn Textile</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#111}
.top{background:#18352e;color:#fff;text-align:center;padding:13px;font-weight:800}
.top span{color:#e9f35b}
.wrap{width:min(1180px,92%);margin:auto;padding:30px 0 70px}
.back{display:inline-block;margin-bottom:22px;font-weight:800;text-decoration:underline}
h1{font-size:clamp(32px,5vw,52px);margin:0 0 8px}
.sub{color:#666;margin:0 0 28px}
.views{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.view{border:1px solid #ddd;border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 3px 12px #0001}
.view img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.view h2{font-size:18px;margin:15px 16px 8px}
.view p{margin:0 16px 16px;color:#666}
.actions{display:flex;gap:12px;margin-top:28px;justify-content:center;flex-wrap:wrap}
button,.buy{border:0;border-radius:7px;padding:14px 24px;font-weight:900;font-size:16px;cursor:pointer}
.cart{background:#18352e;color:#fff}
.buy{background:#16b957;color:#fff;text-decoration:none}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#18352e;color:#fff;padding:14px 20px;border-radius:9px;display:none;font-weight:800;z-index:10}
@media(max-width:800px){.views{grid-template-columns:1fr}.wrap{padding-top:22px}}
</style>
</head>
<body>
<div class="top">WEAVE INN TEXTILE • <span>FACTORY DIRECT</span> • BULK ORDERS</div>
<main class="wrap">
<a class="back" href="index.html">← Back to Home</a>
<h1>Rose Grid Floral Print</h1>
<p class="sub">One product page — three views: Bedroom, Living room and Curtains.</p>
<div class="views">
  <article class="view">
    <img src="rose-grid-bedroom.jpg" alt="Bedroom — Rose Grid Floral Print">
    <h2>🛏️ Bedroom — Rose Grid Floral Print</h2>
  </article>
  <article class="view">
    <img src="rose-grid-living.jpg" alt="Living room — Rose Grid Floral Print">
    <h2>🛋️ Living room — Rose Grid Floral Print</h2>
  </article>
  <article class="view">
    <img src="rose-grid-curtains.jpg" alt="Curtains — Rose Grid Floral Print">
    <h2>🪟 Curtains — Rose Grid Floral Print</h2>
  </article>
</div>
<div class="actions">
  <button class="cart" id="add">Add to Cart</button>
  <a class="buy" id="buy" href="#" target="_blank" rel="noopener">Buy</a>
</div>
</main>
<div class="toast" id="toast"></div>
<script>
const PRODUCT="Rose Grid Floral Print";
const WA="923241454748";
let cart=JSON.parse(localStorage.getItem("weaveInnCart")||"[]");
function showToast(text){
  const t=document.getElementById("toast");
  t.textContent=text;
  t.style.display="block";
  setTimeout(()=>t.style.display="none",1800);
}
document.getElementById("add").addEventListener("click",()=>{
  cart.push({name:PRODUCT,images:["rose-grid-bedroom.jpg","rose-grid-living.jpg","rose-grid-curtains.jpg"]});
  localStorage.setItem("weaveInnCart",JSON.stringify(cart));
  showToast(PRODUCT+" added to cart");
});
document.getElementById("buy").href="https://wa.me/"+WA+"?text="+encodeURIComponent(
  "Hello Weave Inn Textile, I want to buy: "+PRODUCT
);
</script>
</body>
</html>
